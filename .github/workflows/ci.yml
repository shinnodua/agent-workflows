name: CI

on:
  pull_request:
  push:
    branches:
      - main-not-now

jobs:
  package:
    name: Validate package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run workspace checks
        run: bun run workspace:check

      - name: Verify package tarball
        run: bun run package:dry-run
